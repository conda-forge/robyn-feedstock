schema_version: 1

context:
  name: robyn
  version: 0.88.0

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/sparckles/Robyn/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 3149c2c473b756f654424b00584c4563ce23c2d1595df44e0b09d30efc7c3781

build:
  number: 0
  skip: python_impl == 'pypy' or match(python, ">3.14"
  script:
    - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml
    - ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - robyn=robyn.cli:run

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - ${{ compiler('rust') }}
    - cargo-bundle-licenses
  host:
    - maturin >=1.0,<2.0
    - pip
    - python
  run:
    - python
    - inquirerpy ==0.3.4
    - multiprocess >=0.70.14,<0.71.0
    - orjson >=3.11.5,<4.0.0
    - rustimport ==1.3.4
    - if: unix
      then: uvloop ~=0.22.1
    - watchdog >=6.0.0,<7.0.0

tests:
  - python:
      imports:
        - robyn
      pip_check: true
  - requirements:
      run:
        - python
    script:
      - robyn --help

about:
  summary: Async Python backend server with a runtime written in Rust.
  license: BSD-2-Clause
  license_file: LICENSE
  homepage: https://robyn.tech/
  repository: https://github.com/sansyrox/robyn
  documentation: https://sansyrox.github.io/robyn/

extra:
  recipe-maintainers:
    - thewchan
